name: Browser QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tweakin-http.log 2>&1 &
          echo $! > /tmp/tweakin-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/tweakin-http.log
          exit 1

      - name: Run mobile and desktop browser smoke tests
        run: |
          mkdir -p qa-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = (v,m)=>{ if(!v) throw new Error(m); };
          const report={mobile:null,desktop:null,browserErrors:[],stage:'boot'};
          const write=()=>fs.writeFileSync('qa-artifacts/debug.json',JSON.stringify(report,null,2));
          (async()=>{
            const browser = await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            try{
              report.stage='mobile-menu';
              const mobile = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const page = await mobile.newPage();
              page.on('pageerror',e=>report.browserErrors.push(`mobile pageerror: ${e.message}`));
              page.on('console',m=>{if(m.type()==='error')report.browserErrors.push(`mobile console: ${m.text()}`)});
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
              await page.waitForFunction(()=>window.__TWEAKIN_GAME__&&window.__TWEAKIN_DEBUG__&&window.__TWEAKIN_UX__,null,{timeout:30000});
              assert(await page.locator('[data-nav="battle"]').isVisible(),'Battle mode not visible on mobile');
              assert(await page.locator('.brand-word').isVisible(),'Brand mark not visible on mobile');
              assert(await page.locator('.menu-statusline').isVisible(),'Final menu UX statusline missing');
              await page.screenshot({path:'qa-artifacts/mobile-menu.png',fullPage:true});

              report.stage='mobile-battle-setup';
              await page.locator('[data-nav="battle"]').click();
              await page.waitForSelector('#battle-start',{state:'visible',timeout:10000});
              assert(await page.locator('[data-fighter="trump"]').first().isVisible(),'Trump selection card missing');
              assert(await page.locator('[data-fighter="gigachad"]').first().isVisible(),'Gigachad selection card missing');
              await page.waitForSelector('.matchup-strip',{state:'visible',timeout:5000});
              assert((await page.locator('.matchup-strip').innerText()).includes('TRUMP'),'Matchup strip does not reflect player');
              assert((await page.locator('.matchup-strip').innerText()).includes('GIGACHAD'),'Matchup strip does not reflect opponent');
              await page.screenshot({path:'qa-artifacts/mobile-battle-setup.png',fullPage:true});

              report.stage='mobile-portrait-combat';
              await page.locator('#battle-start').click();
              await page.waitForFunction(()=>window.__TWEAKIN_GAME__?.match?.fighters?.length>=2,null,{timeout:15000});
              await page.waitForFunction(()=>window.__TWEAKIN_DEBUG__?.frame>20,null,{timeout:30000});
              assert(await page.locator('.mobile-touch').isVisible(),'Touch controls are hidden on mobile');
              assert(await page.locator('[data-touch="light"]').isVisible(),'Light attack touch button missing');
              const beforeFrame=await page.evaluate(()=>window.__TWEAKIN_DEBUG__.frame);
              await page.locator('[data-touch="light"]').dispatchEvent('pointerdown',{pointerId:1,pointerType:'touch',isPrimary:true});
              await page.waitForTimeout(120);
              await page.locator('[data-touch="light"]').dispatchEvent('pointerup',{pointerId:1,pointerType:'touch',isPrimary:true});
              await page.waitForFunction(f=>window.__TWEAKIN_DEBUG__?.frame>f+4,beforeFrame,{timeout:10000});
              report.mobile=await page.evaluate(()=>window.__TWEAKIN_DEBUG__);
              assert(report.mobile.mode==='battle','Deterministic battle did not start');
              assert(report.mobile.arena==='underpass','Unexpected deterministic QA arena');
              assert(report.mobile.fighters[0]?.id==='trump'&&report.mobile.fighters[1]?.id==='gigachad','Unexpected deterministic QA fighters');
              assert(report.mobile.frame>20,'Combat simulation did not advance');
              assert(Number.isFinite(report.mobile.fps)&&report.mobile.fps>0,'FPS debug invalid');
              assert(report.mobile.lighting?.active===true,'Combat lighting is not active');
              await page.screenshot({path:'qa-artifacts/mobile-fight-portrait.png'});

              report.stage='mobile-landscape-combat';
              await page.setViewportSize({width:844,height:390});
              const landscapeStart=await page.evaluate(()=>window.__TWEAKIN_DEBUG__.frame);
              await page.waitForFunction(f=>window.__TWEAKIN_DEBUG__?.frame>f+10,landscapeStart,{timeout:15000});
              assert(await page.locator('.mobile-touch').isVisible(),'Touch controls disappeared in landscape');
              await page.screenshot({path:'qa-artifacts/mobile-fight-landscape.png'});
              report.mobileLandscape=await page.evaluate(()=>window.__TWEAKIN_DEBUG__);
              await mobile.close();

              report.stage='desktop-menu';
              const desktop = await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1});
              const dpage = await desktop.newPage();
              dpage.on('pageerror',e=>report.browserErrors.push(`desktop pageerror: ${e.message}`));
              dpage.on('console',m=>{if(m.type()==='error')report.browserErrors.push(`desktop console: ${m.text()}`)});
              await dpage.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});
              await dpage.waitForFunction(()=>window.__TWEAKIN_GAME__&&window.__TWEAKIN_SHOWCASE__&&window.__TWEAKIN_UX__,null,{timeout:30000});
              assert(await dpage.locator('.menu-statusline').isVisible(),'Desktop final menu UX missing');
              await dpage.screenshot({path:'qa-artifacts/desktop-menu.png'});

              report.stage='desktop-roster';
              await dpage.locator('[data-nav="roster"]').click();
              await dpage.waitForTimeout(900);
              assert(await dpage.locator('[data-rid="trump"]').isVisible(),'Roster did not render');
              await dpage.locator('[data-rid="trump"]').click();
              await dpage.waitForTimeout(450);
              assert((await dpage.evaluate(()=>window.__TWEAKIN_SHOWCASE__?.lastId))==='trump','3D fighter viewer did not focus selected fighter');
              await dpage.screenshot({path:'qa-artifacts/desktop-roster.png'});
              report.desktop=await dpage.evaluate(()=>window.__TWEAKIN_DEBUG__);
              const debugErrors=[...(report.mobile?.errors||[]),...(report.mobileLandscape?.errors||[]),...(report.desktop?.errors||[])];
              if(debugErrors.length)report.browserErrors.push(...debugErrors.map(x=>`runtime: ${x}`));
              await desktop.close();
              report.stage='complete';write();
              if(report.browserErrors.length)throw new Error(report.browserErrors.join('\n'));
              console.log('Browser QA passed: final UX layer, deterministic Trump vs Gigachad battle, touch input, portrait/landscape framing, desktop menu and fighter viewer.');
            } finally {
              write();
              await browser.close();
            }
          })().catch(e=>{report.browserErrors.push(`fatal: ${e.message}`);write();console.error(e);process.exit(1)});
          NODE

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweakin-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
