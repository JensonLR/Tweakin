name: Validate TWEAKIN

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production files
        run: |
          set -e
          for f in \
            index.html main.js style.css style-premium.css style-cinematic.css style-enhancements.css style-extra.css style-brand.css style-polish.css sw.js manifest.webmanifest icon.svg \
            assets/tweakin-logo.webp assets/tweakin-hero.webp \
            game/Game.js game/CombatMatch.js game/CinematicCombatMatch.js game/Fighter.js game/DetailedFighter.js \
            game/UltraFighter.js game/EliteFighter.js game/SignatureFighter.js game/FaceDetail.js game/FacialAnimator.js game/HitReaction.js game/ComboChoreography.js \
            game/CharacterDetail.js game/AnatomyDetail.js game/CombatWear.js game/Arena.js game/DetailedArena.js game/UltraArena.js game/VenueArena.js game/ArenaAtmosphere.js game/CombatLighting.js \
            game/SurfaceDetail.js game/PresentationDirector.js game/MenuBackdrop.js game/DOMFX.js game/PostFX.js game/PerformanceGovernor.js game/Input.js game/AI.js \
            ui/AppUI.js ui/UIShowcase.js ui/ExtraModes.js ui/HUDPortraits.js audio/AudioEngine.js persistence/SaveStore.js multiplayer/NetSession.js \
            data/roster.js data/arenas.js data/career.js core/types.js core/math.js core/combatRules.js vendor/three.js
          do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: JavaScript syntax check
        run: find . -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Import graph smoke check
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = [];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, {withFileTypes:true})) {
              if (ent.name === '.git' || ent.name === 'node_modules') continue;
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p);
              else if (p.endsWith('.js')) files.push(p);
            }
          }
          walk('.');
          let failed = false;
          const re = /(?:from\s+|import\s*)['\"](\.{1,2}\/[^'\"]+)['\"]/g;
          for (const file of files) {
            const src = fs.readFileSync(file, 'utf8');
            for (const m of src.matchAll(re)) {
              const resolved = path.resolve(path.dirname(file), m[1]);
              if (!fs.existsSync(resolved)) {
                console.error(`Missing import: ${file} -> ${m[1]}`);
                failed = true;
              }
            }
          }
          if (failed) process.exit(1);
          console.log(`Validated ${files.length} JS modules and local imports.`);
          NODE

      - name: Validate HTML asset references
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/(?:src|href)=["']\.\/([^"'#?]+)["']/g)].map(m=>m[1]);
          const missing=refs.filter(x=>!fs.existsSync(x));
          if(missing.length){console.error('Missing HTML assets:',missing);process.exit(1)}
          for(const required of ['assets/tweakin-logo.webp','assets/tweakin-hero.webp','style-brand.css','style-polish.css']) if(!refs.includes(required)) throw new Error(`Required branded asset not referenced by HTML: ${required}`);
          console.log('HTML assets OK:',refs.join(', '));
          NODE

      - name: Validate service worker local cache manifest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('sw.js','utf8');
          const match=sw.match(/const CORE=\[(.*?)\];/s);
          if(!match) throw new Error('CORE cache manifest missing');
          const refs=[...match[1].matchAll(/'([^']+)'/g)].map(m=>m[1]);
          const local=refs.filter(x=>x.startsWith('./')&&x!=='./').map(x=>x.slice(2));
          const missing=local.filter(x=>!fs.existsSync(x));
          if(missing.length){console.error('Missing cached files:',missing);process.exit(1)}
          for(const required of ['style-brand.css','style-polish.css','ui/HUDPortraits.js','game/SignatureFighter.js','game/FaceDetail.js','game/FacialAnimator.js','game/HitReaction.js','game/ComboChoreography.js','game/AnatomyDetail.js','game/CinematicCombatMatch.js','game/VenueArena.js','game/ArenaAtmosphere.js','game/CombatLighting.js','assets/tweakin-logo.webp','assets/tweakin-hero.webp']){
            if(!local.includes(required)){console.error('Required runtime missing from offline cache:',required);process.exit(1)}
          }
          console.log(`Offline cache manifest validates ${local.length} local assets.`);
          NODE

      - name: Validate roster and arenas are populated
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const roster=fs.readFileSync('data/roster.js','utf8');
          const arenas=fs.readFileSync('data/arenas.js','utf8');
          const fighterIds=['trump','netanyahu','kirk','floyd','wojak','gigachad','agarthan','greek'];
          for(const id of fighterIds) if(!roster.includes(`id: '${id}'`)&&!roster.includes(`id:'${id}'`)) throw new Error(`Roster fighter missing: ${id}`);
          const arenaCount=(arenas.match(/\bid:\s*'/g)||[]).length;
          if(arenaCount<12) throw new Error(`Expected at least 12 arenas, found ${arenaCount}`);
          console.log(`Roster and ${arenaCount} arenas present.`);
          NODE

      - name: Validate presentation stack
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const sig=fs.readFileSync('game/SignatureFighter.js','utf8');
          const elite=fs.readFileSync('game/EliteFighter.js','utf8');
          const game=fs.readFileSync('game/Game.js','utf8');
          const face=fs.readFileSync('game/FacialAnimator.js','utf8');
          const hit=fs.readFileSync('game/HitReaction.js','utf8');
          const combo=fs.readFileSync('game/ComboChoreography.js','utf8');
          const anatomy=fs.readFileSync('game/AnatomyDetail.js','utf8');
          const lighting=fs.readFileSync('game/CombatLighting.js','utf8');
          const menu=fs.readFileSync('game/MenuBackdrop.js','utf8');
          const hud=fs.readFileSync('ui/HUDPortraits.js','utf8');
          const main=fs.readFileSync('main.js','utf8');
          const brand=fs.readFileSync('style-brand.css','utf8');
          const polish=fs.readFileSync('style-polish.css','utf8');
          if(!sig.includes('FacialAnimator')) throw new Error('Facial animator not wired');
          if(!sig.includes('HitReaction')) throw new Error('Hit reaction layer not wired');
          if(!sig.includes('triggerFinisherReaction')) throw new Error('Finisher reaction choreography missing');
          if(!sig.includes('entrancePose')) throw new Error('Entrance choreography missing');
          if(!sig.includes('victoryPose')) throw new Error('Victory choreography missing');
          if(!elite.includes('ComboChoreography')||!combo.includes('class ComboChoreography')) throw new Error('Combo choreography not wired');
          if(!elite.includes('addAnatomyDetail')||!anatomy.includes('addAnatomyDetail')) throw new Error('Anatomy detail not wired');
          if(!game.includes('triggerSlowmo')) throw new Error('Impact slow motion missing');
          if(!game.includes('ArenaAtmosphere')) throw new Error('Arena atmosphere not wired');
          if(!game.includes('CombatLighting')||!game.includes('combatLighting?.update')) throw new Error('Dynamic combat lighting not wired');
          if(!lighting.includes('SpotLight')||!lighting.includes('camera.position')) throw new Error('Combat lighting director appears invalid');
          if(!game.includes('introTime')) throw new Error('Pre-fight camera sequence missing');
          if(!face.includes('nextBlink')) throw new Error('Facial blink controller missing');
          if(!hit.includes('class HitReaction')||!hit.includes('group.position.x')||!hit.includes('travel')) throw new Error('Physical directional hit follow-through missing');
          if(!menu.includes('SignatureFighter')) throw new Error('Full signature fighters not used by menus');
          if(!main.includes('HUDPortraits')) throw new Error('HUD portraits not bootstrapped');
          if(!hud.includes('data')) throw new Error('HUD portrait module appears invalid');
          if(!brand.includes('tweakin-hero.webp')||!brand.includes('data-portrait')) throw new Error('Official fighter artwork not wired to interface/HUD');
          if(!polish.includes('tweakin-hero.webp')||!polish.includes('.touch-device .mobile-touch')) throw new Error('Final hero/touch polish not wired');
          console.log('Presentation, combat, physical reactions, lighting, branding, touch and HUD stacks are wired.');
          NODE
