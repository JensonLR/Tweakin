name: Validate TWEAKIN

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production files
        run: |
          set -e
          for f in \
            index.html main.js style.css style-premium.css style-cinematic.css style-enhancements.css style-extra.css style-brand.css style-polish.css style-final.css style-ux.css sw.js manifest.webmanifest icon.svg \
            assets/tweakin-logo.webp assets/tweakin-hero.webp assets/characters/reference/quaternius-common-rig.glb assets/characters/reference/formal-rig-reference.glb assets/characters/reference/quaternius-human.glb vendor/three.js \
            ui/AppUI.js ui/UIShowcaseV2.js ui/AuthoredViewer.js ui/ExtraModes.js ui/CareerStory.js ui/HUDPortraits.js ui/UXEnhancements.js \
            game/Game.js game/CombatMatch.js game/CinematicCombatMatch.js game/Fighter.js game/DetailedFighter.js game/UltraFighter.js game/EliteFighter.js game/SignatureFighter.js game/ImportedCombatVisual.js game/AuthoredCharacter.js game/AnimationContract.js game/FallbackMotion.js game/ParametricLikeness.js game/BodyLikeness.js game/HumanProportionFix.js \
            game/FaceDetail.js game/FacialAnimator.js game/HitReaction.js game/ComboChoreography.js game/CharacterDetail.js game/AnatomyDetail.js game/CombatWear.js \
            game/Arena.js game/DetailedArena.js game/UltraArena.js game/VenueArena.js game/ArenaAtmosphere.js game/CombatLighting.js game/SurfaceDetail.js game/PresentationDirector.js game/MenuBackdrop.js game/DOMFX.js game/PostFX.js game/PerformanceGovernor.js game/Input.js game/AI.js \
            data/roster.js data/characterAssets.js data/arenas.js data/career.js core/types.js core/math.js core/combatRules.js audio/AudioEngine.js persistence/SaveStore.js multiplayer/NetSession.js scripts/audit-character-assets.mjs
          do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: JavaScript syntax and import graph
        run: |
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),files=[];
          function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(['.git','node_modules'].includes(e.name))continue;const p=path.join(d,e.name);e.isDirectory()?walk(p):(p.endsWith('.js')||p.endsWith('.mjs'))&&files.push(p)}} walk('.');
          let bad=false;const re=/(?:from\s+|import\s*)['\"](\.{1,2}\/[^'\"]+)['\"]/g;
          for(const f of files){const src=fs.readFileSync(f,'utf8');for(const m of src.matchAll(re)){const raw=m[1],candidates=[path.resolve(path.dirname(f),raw),path.resolve(path.dirname(f),`${raw}.js`),path.resolve(path.dirname(f),`${raw}.mjs`)];if(!candidates.some(fs.existsSync)){console.error(`Missing import: ${f} -> ${raw}`);bad=true}}}
          if(bad)process.exit(1);console.log(`Validated ${files.length} JavaScript modules.`)
          NODE

      - name: Validate HTML and offline cache
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const htmlRefs=[...html.matchAll(/(?:src|href)=["']\.\/([^"'#?]+)["']/g)].map(m=>m[1]);
          const requiredHtml=['assets/tweakin-logo.webp','assets/tweakin-hero.webp','style-brand.css','style-polish.css','style-final.css','style-ux.css','main.js'];
          for(const r of requiredHtml)if(!htmlRefs.includes(r))throw new Error(`Required HTML runtime not referenced: ${r}`);
          for(const r of htmlRefs)if(!fs.existsSync(r))throw new Error(`HTML references missing file: ${r}`);
          const sw=fs.readFileSync('sw.js','utf8'),match=sw.match(/const CORE=\[(.*?)\];/s);if(!match)throw new Error('CORE cache manifest missing');
          const refs=[...match[1].matchAll(/'([^']+)'/g)].map(m=>m[1]);const local=refs.filter(x=>x.startsWith('./')&&x!=='./').map(x=>x.slice(2));
          for(const r of local)if(!fs.existsSync(r))throw new Error(`Offline cache references missing file: ${r}`);
          for(const r of [...requiredHtml,'ui/UXEnhancements.js','ui/HUDPortraits.js','game/CombatLighting.js','game/ImportedCombatVisual.js','game/AuthoredCharacter.js','game/AnimationContract.js','game/FallbackMotion.js','game/ParametricLikeness.js','game/BodyLikeness.js','game/HumanProportionFix.js','game/PostFX.js','game/PresentationDirector.js','audio/AudioEngine.js'])if(!local.includes(r))throw new Error(`Production runtime missing from offline cache: ${r}`);
          console.log(`HTML and offline cache validate ${local.length} local assets.`);
          NODE

      - name: Audit fighter GLBs
        run: node scripts/audit-character-assets.mjs

      - name: Validate roster asset gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('data/characterAssets.js','utf8');
          if(!src.includes("status:'reference-only'"))throw new Error('Reference rigs must be marked reference-only');
          const imported=fs.readFileSync('game/ImportedCombatVisual.js','utf8');
          for(const forbidden of ['formal-rig-reference.glb','quaternius-common-rig.glb','quaternius-human.glb'])if(imported.includes(forbidden))throw new Error(`Reference rig leaked into roster combat runtime: ${forbidden}`);
          if(!imported.includes('requireCombatReady:true'))throw new Error('Authored combat readiness gate is not enforced');
          const readyEntries=[...src.matchAll(/\b([a-z]+):\{path:'([^']+)',status:'ready'/g)];
          for(const m of readyEntries){const p=m[2].replace(/^\.\//,'');if(!fs.existsSync(p))throw new Error(`Ready fighter ${m[1]} points to missing asset: ${p}`)}
          console.log(`Roster asset gate validated. ${readyEntries.length} fighter-specific authored assets are currently marked ready.`);
          NODE

      - name: Validate game content and presentation stack
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=f=>fs.readFileSync(f,'utf8');
          const roster=read('data/roster.js'),arenas=read('data/arenas.js');
          for(const id of ['trump','netanyahu','kirk','floyd','wojak','gigachad','agarthan','greek'])if(!roster.includes(`id: '${id}'`)&&!roster.includes(`id:'${id}'`))throw new Error(`Roster fighter missing: ${id}`);
          const arenaCount=(arenas.match(/\bid:\s*'/g)||[]).length;if(arenaCount<12)throw new Error(`Expected at least 12 arenas, found ${arenaCount}`);
          const main=read('main.js'),game=read('game/Game.js'),sig=read('game/SignatureFighter.js'),imported=read('game/ImportedCombatVisual.js'),authored=read('game/AuthoredCharacter.js'),contract=read('game/AnimationContract.js'),fallback=read('game/FallbackMotion.js'),elite=read('game/EliteFighter.js'),likeness=read('game/ParametricLikeness.js'),body=read('game/BodyLikeness.js'),human=read('game/HumanProportionFix.js'),face=read('game/FacialAnimator.js'),hit=read('game/HitReaction.js'),lighting=read('game/CombatLighting.js'),post=read('game/PostFX.js'),fx=read('game/PresentationDirector.js'),ux=read('ui/UXEnhancements.js'),finalCss=read('style-final.css'),uxCss=read('style-ux.css');
          const checks=[
            [main.includes('UXEnhancements'),'Dynamic UX layer not bootstrapped'],
            [main.includes('HUDPortraits'),'HUD portraits not bootstrapped'],
            [game.includes('triggerSlowmo'),'Impact slow motion missing'],
            [game.includes('CombatLighting')&&game.includes('combatLighting?.update'),'Combat lighting not wired'],
            [sig.includes('ImportedCombatVisual')&&sig.includes('importedVisual?.update'),'Authored combat character runtime not wired'],
            [sig.includes('FallbackMotion')&&sig.includes('fallbackMotion?.apply'),'Fallback motion polish not wired'],
            [imported.includes('loadAuthoredCharacter')&&imported.includes('AnimationMixer'),'Authored GLB combat visual stack incomplete'],
            [authored.includes('SkeletonUtils.clone')&&authored.includes('validateCombatAnimations'),'Skeletal cloning/animation validation incomplete'],
            [contract.includes('REQUIRED_COMBAT_ANIMATIONS')&&contract.includes("'grapple'")&&contract.includes("'ko'"),'Combat animation contract incomplete'],
            [fallback.includes('stanceAndLocomotion')&&fallback.includes('grapple(p,side,id)'),'Fallback motion choreography incomplete'],
            [sig.includes('FacialAnimator')&&sig.includes('HitReaction')&&sig.includes('victoryPose'),'Fallback signature animation stack incomplete'],
            [elite.includes('ComboChoreography')&&elite.includes('addCharacterDetail'),'Fallback fighter detail stack incomplete'],
            [elite.includes('applyParametricLikeness')&&likeness.includes('applyParametricLikeness'),'Parametric likeness pipeline not wired'],
            [elite.includes('applyBodyLikeness')&&body.includes('applyBodyLikeness'),'Body likeness pipeline not wired'],
            [sig.includes('applyHumanProportions')&&human.includes('applyHumanProportions'),'Human proportion correction not wired'],
            [face.includes('nextBlink'),'Facial animation blink controller missing'],
            [hit.includes('class HitReaction'),'Hit reaction system missing'],
            [lighting.includes('DirectionalLight')&&lighting.includes('HemisphereLight'),'Readable cinematic lighting stack incomplete'],
            [post.includes('ShaderMaterial')&&post.includes('impact'),'Post-processing/impact grade missing'],
            [fx.includes('speedStreaks')&&fx.includes('spawnTrail'),'Cinematic impact FX incomplete'],
            [ux.includes('matchup-strip')&&ux.includes('result-metrics'),'Final UX enhancement states missing'],
            [finalCss.includes('.result-shell')&&finalCss.includes('.boot-shell'),'Final cinematic CSS incomplete'],
            [uxCss.includes('.matchup-strip')&&uxCss.includes('.result-metrics'),'Dynamic UX CSS incomplete']
          ];
          for(const [ok,msg] of checks)if(!ok)throw new Error(msg);
          console.log(`Roster, ${arenaCount} arenas, likeness, authored-character gate, fallback motion, cinematic presentation, UX and combat stacks are wired.`);
          NODE
