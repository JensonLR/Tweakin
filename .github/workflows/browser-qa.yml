name: Browser QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tweakin-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/tweakin-http.log; exit 1
      - name: Run full presentation browser QA
        run: |
          mkdir -p qa-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const report={mobile:null,mobileLandscape:null,desktop:null,browserErrors:[],stage:'boot'};
          const write=()=>fs.writeFileSync('qa-artifacts/debug.json',JSON.stringify(report,null,2));
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            try{
              const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const page=await mobile.newPage();page.on('pageerror',e=>report.browserErrors.push(`mobile pageerror: ${e.message}`));page.on('console',m=>{if(m.type()==='error')report.browserErrors.push(`mobile console: ${m.text()}`)});
              report.stage='mobile-menu';await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});await page.waitForFunction(()=>window.__TWEAKIN_GAME__&&window.__TWEAKIN_DEBUG__&&window.__TWEAKIN_UX__,null,{timeout:30000});
              assert(await page.locator('[data-nav="battle"]').isVisible(),'Battle mode not visible');assert(await page.locator('.brand-word').isVisible(),'Brand mark missing');assert(await page.locator('.menu-statusline').isVisible(),'Final menu UX missing');assert(await page.locator('.menu-keyart').isVisible(),'Authored menu key art layer missing');const keyArt=await page.locator('.menu-keyart').evaluate(el=>getComputedStyle(el,'::before').backgroundImage);assert(keyArt.includes('tweakin-hero.webp'),'Menu key art is not using approved hero artwork');await page.screenshot({path:'qa-artifacts/mobile-menu.png',fullPage:true});
              report.stage='mobile-battle-setup';await page.locator('[data-nav="battle"]').click();await page.waitForSelector('#battle-start',{state:'visible',timeout:10000});assert(await page.locator('[data-fighter="trump"]').first().isVisible(),'Trump card missing');assert(await page.locator('[data-fighter="gigachad"]').first().isVisible(),'Gigachad card missing');const portraitDisplay=await page.locator('[data-fighter="trump"] .fighter-silhouette').first().evaluate(el=>getComputedStyle(el).display);assert(portraitDisplay!=='none','Authored fighter selection portrait is hidden');await page.waitForSelector('.matchup-strip',{state:'visible',timeout:5000});const matchup=await page.locator('.matchup-strip').innerText();assert(matchup.includes('TRUMP')&&matchup.includes('GIGACHAD'),'Matchup strip incorrect');await page.screenshot({path:'qa-artifacts/mobile-battle-setup.png',fullPage:true});
              report.stage='mobile-portrait-combat';await page.locator('#battle-start').click();await page.waitForFunction(()=>window.__TWEAKIN_GAME__?.match?.fighters?.length>=2,null,{timeout:15000});await page.waitForFunction(()=>window.__TWEAKIN_DEBUG__?.frame>20,null,{timeout:30000});assert(await page.locator('.mobile-touch').isVisible(),'Touch controls hidden');assert(await page.locator('[data-touch="light"]').isVisible(),'Light attack missing');const before=await page.evaluate(()=>window.__TWEAKIN_DEBUG__.frame);await page.locator('[data-touch="light"]').dispatchEvent('pointerdown',{pointerId:1,pointerType:'touch',isPrimary:true});await page.waitForTimeout(120);await page.locator('[data-touch="light"]').dispatchEvent('pointerup',{pointerId:1,pointerType:'touch',isPrimary:true});await page.waitForFunction(f=>window.__TWEAKIN_DEBUG__?.frame>f+4,before,{timeout:10000});report.mobile=await page.evaluate(()=>window.__TWEAKIN_DEBUG__);assert(report.mobile.mode==='battle','Battle did not start');assert(report.mobile.arena==='underpass','Unexpected arena');assert(report.mobile.fighters[0]?.id==='trump'&&report.mobile.fighters[1]?.id==='gigachad','Unexpected fighters');assert(report.mobile.lighting?.active===true,'Combat lighting inactive');assert(Number.isFinite(report.mobile.fps)&&report.mobile.fps>0,'FPS invalid');await page.waitForFunction(()=>document.querySelector('.hud-fighter[data-portrait]'),null,{timeout:5000});const hudIdentity=await page.locator('.hud-fighter[data-portrait]').first().evaluate(el=>({id:el.dataset.portrait,content:getComputedStyle(el,'::before').content,bg:getComputedStyle(el,'::before').backgroundImage}));assert(hudIdentity.id==='trump','HUD identity tile has wrong fighter');assert(hudIdentity.content.includes('TR'),'HUD identity tile initials missing');assert(hudIdentity.bg.includes('gradient'),'HUD identity tile treatment missing');await page.screenshot({path:'qa-artifacts/mobile-fight-portrait.png'});
              report.stage='mobile-landscape-combat';await page.setViewportSize({width:844,height:390});const land=await page.evaluate(()=>window.__TWEAKIN_DEBUG__.frame);await page.waitForFunction(f=>window.__TWEAKIN_DEBUG__?.frame>f+10,land,{timeout:15000});assert(await page.locator('.mobile-touch').isVisible(),'Touch controls disappeared landscape');report.mobileLandscape=await page.evaluate(()=>window.__TWEAKIN_DEBUG__);await page.screenshot({path:'qa-artifacts/mobile-fight-landscape.png'});
              report.stage='mobile-ko';await page.evaluate(()=>{const g=window.__TWEAKIN_GAME__,m=g.match;if(!m)return;m.fighters[0].metrics.damage=128;m.fighters[0].metrics.hits=11;m.fighters[0].metrics.bestCombo=4;m.fighters[1].metrics.damage=74;m.fighters[1].metrics.hits=7;m.fighters[1].metrics.bestCombo=3;m.finish(m.fighters[0]);});await page.waitForSelector('.ko-sting',{state:'visible',timeout:2500});assert((await page.locator('.ko-sting').innerText()).includes('KNOCKOUT'),'Knockout motion graphic missing');await page.screenshot({path:'qa-artifacts/mobile-knockout.png'});
              report.stage='mobile-result';await page.waitForSelector('.result-shell',{state:'visible',timeout:6000});await page.waitForSelector('.result-metrics',{state:'visible',timeout:3000});assert((await page.locator('.result-card').innerText()).includes('TRUMP WINS'),'Winner result missing');assert((await page.locator('.result-metrics').innerText()).includes('128'),'Fight metrics missing');await page.screenshot({path:'qa-artifacts/mobile-result.png'});await mobile.close();
              report.stage='desktop-menu';const desktop=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1});const dpage=await desktop.newPage();dpage.on('pageerror',e=>report.browserErrors.push(`desktop pageerror: ${e.message}`));dpage.on('console',m=>{if(m.type()==='error')report.browserErrors.push(`desktop console: ${m.text()}`)});await dpage.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:45000});await dpage.waitForFunction(()=>window.__TWEAKIN_GAME__&&window.__TWEAKIN_SHOWCASE__&&window.__TWEAKIN_UX__,null,{timeout:30000});assert(await dpage.locator('.menu-statusline').isVisible(),'Desktop final menu UX missing');assert(await dpage.locator('.menu-keyart').isVisible(),'Desktop key art missing');await dpage.screenshot({path:'qa-artifacts/desktop-menu.png'});
              report.stage='desktop-roster';await dpage.locator('[data-nav="roster"]').click();await dpage.waitForTimeout(900);assert(await dpage.locator('[data-rid="trump"]').isVisible(),'Roster missing');await dpage.locator('[data-rid="trump"]').click();await dpage.waitForTimeout(450);assert((await dpage.evaluate(()=>window.__TWEAKIN_SHOWCASE__?.lastId))==='trump','3D fighter viewer did not focus Trump');await dpage.screenshot({path:'qa-artifacts/desktop-roster.png'});
              report.stage='desktop-guide';await dpage.locator('[data-back]').click();await dpage.waitForSelector('[data-extra-mode="guide"]',{state:'visible',timeout:5000});await dpage.locator('[data-extra-mode="guide"]').click();await dpage.waitForSelector('.guide-grid',{state:'visible',timeout:5000});assert(await dpage.locator('.guide-card').count()>=8,'Fight Guide content incomplete');await dpage.screenshot({path:'qa-artifacts/desktop-guide.png'});
              report.stage='desktop-options';await dpage.locator('[data-back]').click();await dpage.locator('[data-nav="options"]').click();await dpage.waitForSelector('.options-panel',{state:'visible',timeout:5000});assert(await dpage.locator('#save-options').isVisible(),'Options action missing');await dpage.screenshot({path:'qa-artifacts/desktop-options.png'});
              report.desktop=await dpage.evaluate(()=>window.__TWEAKIN_DEBUG__);const debugErrors=[...(report.mobile?.errors||[]),...(report.mobileLandscape?.errors||[]),...(report.desktop?.errors||[])];if(debugErrors.length)report.browserErrors.push(...debugErrors.map(x=>`runtime: ${x}`));await desktop.close();report.stage='complete';write();if(report.browserErrors.length)throw new Error(report.browserErrors.join('\n'));console.log('TWEAKIN authored presentation browser QA passed.');
            }finally{write();await browser.close()}
          })().catch(e=>{report.browserErrors.push(`fatal: ${e.message}`);write();console.error(e);process.exit(1)});
          NODE
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweakin-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
