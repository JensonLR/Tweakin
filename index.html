<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#090708" />
<title>TWEAKIN</title>
<style>
:root{--bg:#090708;--ink:#f4efe7;--muted:#a79e95;--red:#d71920;--line:#34272a;--panel:#151012;--gold:#d0a566}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050405;color:var(--ink);font-family:Impact,Haettenschweiler,'Arial Narrow Bold',system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}.app{position:fixed;inset:0;background:radial-gradient(circle at 55% 20%,#321a1d 0,#100b0d 35%,#050405 75%)}
.noise{position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}.menu{padding:max(22px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));flex-direction:column;gap:14px;overflow:auto}
.brand{font-size:clamp(56px,19vw,110px);line-height:.82;letter-spacing:-.055em;transform:skewX(-9deg);text-shadow:3px 3px 0 #000,-3px -2px 0 #000}.brand span{display:block}.brand .t1{color:#fff}.brand .t2{color:var(--red);margin-left:11vw}.strap{font-family:system-ui,sans-serif;font-weight:800;letter-spacing:.18em;font-size:11px;color:#bfb5ac;text-transform:uppercase;margin-top:4px}
.panel{background:linear-gradient(180deg,rgba(28,19,22,.96),rgba(14,10,12,.96));border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.section-title{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.17em;color:#d6cbc0;text-transform:uppercase;margin:0 0 10px;font-weight:900}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fighter{min-height:72px;text-align:left;padding:12px;border-radius:13px;background:#21171a;border:1px solid #3a2a2d;position:relative;overflow:hidden}.fighter:active{transform:scale(.985)}.fighter.selected{background:linear-gradient(135deg,#421317,#211014);border-color:#ff4248;box-shadow:0 0 0 2px rgba(215,25,32,.22) inset}.fighter b{display:block;font-size:22px;line-height:.9;text-transform:uppercase}.fighter small{display:block;margin-top:7px;font:700 9px/1.1 system-ui,sans-serif;letter-spacing:.08em;color:#bcaea7;text-transform:uppercase}.dot{position:absolute;width:46px;height:46px;border-radius:50%;right:-11px;top:-8px;background:radial-gradient(circle at 35% 30%,#e6c6b2,#6e3e35 52%,#161014 53%);opacity:.65}
.actions{display:grid;grid-template-columns:1fr;gap:9px}.primary{min-height:62px;border-radius:14px;background:linear-gradient(135deg,#f3262d,#9b0f14);font-size:29px;letter-spacing:.02em;box-shadow:0 12px 30px rgba(215,25,32,.28)}.primary:active{transform:translateY(2px)}.secondary{min-height:44px;border-radius:12px;background:#23191c;border:1px solid #49353a;font:900 12px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.disclaimer{font:600 9px/1.4 system-ui,sans-serif;color:#81756f;padding:2px 4px 12px}
.game{flex-direction:column;background:#080607}.topbar{position:absolute;left:0;right:0;top:0;z-index:5;padding:max(8px,env(safe-area-inset-top)) 10px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:start;pointer-events:none}.hudside{min-width:0}.hudside.right{text-align:right}.name{font-size:19px;line-height:1;text-transform:uppercase;text-shadow:2px 2px #000}.bar{height:10px;margin-top:5px;border:1px solid #6b5557;background:#170f11;overflow:hidden}.right .bar>i{margin-left:auto}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#a70f14,#f32c33);transition:width .15s}.condition i{background:linear-gradient(90deg,#756340,#d1b26c)}.meter i{background:linear-gradient(90deg,#695226,#f2bd4a)}.timer{font-size:28px;line-height:1;padding:2px 6px;color:#f5efe5;text-shadow:2px 2px #000}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#100b0d}.controls{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:end;pointer-events:none}.stick{width:132px;height:132px;border-radius:50%;border:1px solid #77676a;background:rgba(13,10,11,.54);box-shadow:0 0 0 8px rgba(0,0,0,.16) inset;position:relative;pointer-events:auto;touch-action:none}.nub{position:absolute;left:42px;top:42px;width:48px;height:48px;border-radius:50%;background:rgba(244,239,231,.82);box-shadow:0 4px 15px #000}.buttons{width:min(48vw,245px);display:grid;grid-template-columns:repeat(3,1fr);gap:7px;pointer-events:auto}.act{aspect-ratio:1;border-radius:50%;background:rgba(31,22,24,.88);border:1px solid #725c61;font:900 10px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 7px 14px rgba(0,0,0,.35)}.act.big{background:rgba(125,15,20,.94);border-color:#e7353a}.act:active,.act.down{transform:scale(.92);background:#c51c22}.pause{position:absolute;right:8px;top:52px;z-index:9;width:44px;height:38px;border-radius:10px;background:rgba(20,14,16,.8);border:1px solid #4c393d;font:800 18px system-ui,sans-serif}
.toast{position:absolute;z-index:7;left:50%;top:18%;transform:translateX(-50%);font-size:34px;text-align:center;text-transform:uppercase;text-shadow:3px 3px #000;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.overlay{position:absolute;z-index:10;inset:0;background:rgba(4,3,4,.86);display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.card{width:min(92vw,430px);background:#171113;border:1px solid #4d393e;border-radius:18px;padding:20px;text-align:center}.card h2{font-size:44px;margin:0 0 8px}.card p{font:600 13px system-ui,sans-serif;color:#b9aaa2}.card .primary{width:100%;margin-top:10px}
@media (orientation:landscape){.menu{max-width:900px;margin:auto;width:100%;display:grid!important;grid-template-columns:.8fr 1.2fr;align-content:center;overflow:hidden}.menu .hero{align-self:center}.menu .panel{max-height:86vh;overflow:auto}.brand{font-size:min(17vw,120px)}.brand .t2{margin-left:5vw}.roster{grid-template-columns:repeat(2,1fr)}.fighter{min-height:58px}.stick{width:116px;height:116px}.nub{left:36px;top:36px;width:44px;height:44px}.buttons{width:min(40vw,260px)}.controls{padding-bottom:max(8px,env(safe-area-inset-bottom))}}
@media (min-width:700px) and (orientation:landscape){.roster{grid-template-columns:repeat(4,1fr)}.menu{grid-template-columns:.7fr 1.3fr}}
</style>
</head>
<body>
<div class="app"><div class="noise"></div>
<section id="menu" class="screen menu active">
 <div class="hero"><div class="brand"><span class="t1">TWEA</span><span class="t2">KIN</span></div><div class="strap">underground crossover fighting</div></div>
 <div class="panel"><div class="section-title">Choose fighter</div><div id="roster" class="roster"></div><div class="actions" style="margin-top:12px"><button id="fightBtn" class="primary">FIGHT AS TRUMP</button><button id="randomBtn" class="secondary">Random matchup</button></div><div class="disclaimer">TWEAKIN is a fictional parody fighting game. No depicted person, estate, organisation or public figure endorses or is affiliated with this project.</div></div>
</section>
<section id="game" class="screen game">
 <canvas id="gameCanvas"></canvas>
 <div class="topbar"><div class="hudside"><div id="pName" class="name">TRUMP</div><div class="bar"><i id="pCon"></i></div><div class="bar condition"><i id="pPhys"></i></div><div class="bar meter"><i id="pMeter"></i></div></div><div id="timer" class="timer">60</div><div class="hudside right"><div id="eName" class="name">GIGACHAD</div><div class="bar"><i id="eCon"></i></div><div class="bar condition"><i id="ePhys"></i></div><div class="bar meter"><i id="eMeter"></i></div></div></div>
 <button id="pauseBtn" class="pause">Ⅱ</button><div id="toast" class="toast"></div>
 <div class="controls"><div id="stick" class="stick"><div id="nub" class="nub"></div></div><div class="buttons"><button class="act" data-act="block">Block</button><button class="act" data-act="grab">Grab</button><button class="act" data-act="run">Run</button><button class="act" data-act="light">Light</button><button class="act big" data-act="heavy">Heavy</button><button class="act big" data-act="special">Special</button></div></div>
 <div id="endOverlay" class="overlay"><div class="card"><h2 id="endTitle">WINNER</h2><p id="endCopy"></p><button id="rematchBtn" class="primary">REMATCH</button><button id="menuBtn" class="secondary" style="width:100%;margin-top:8px">BACK TO ROSTER</button></div></div>
</section>
</div>
<script>
(()=>{
'use strict';
const fighters=[
 {id:'Trump',style:'Streetfighting + Wrestling',col:'#e0a37d',out:'#151d35',speed:.92,power:1.12,tough:1.10},
 {id:'Netanyahu',style:'Martial Arts + Streetfighting',col:'#c79d82',out:'#202a3d',speed:1.04,power:.99,tough:1.03},
 {id:'Charlie Kirk',style:'Kickboxing + Martial Arts',col:'#d9b195',out:'#17212e',speed:1.11,power:.94,tough:.94},
 {id:'George Floyd',style:'Wrestling + Streetfighting',col:'#6f4535',out:'#28211d',speed:.94,power:1.10,tough:1.12},
 {id:'Wojak',style:'Streetfighting + Martial Arts',col:'#e9e7e3',out:'#9f9990',speed:1.06,power:.96,tough:.91},
 {id:'Gigachad',style:'Wrestling + Kickboxing',col:'#b4937e',out:'#0d0d0e',speed:1.01,power:1.18,tough:1.18},
 {id:'Agarthan Gatekeeper',style:'Martial Arts + Kickboxing',col:'#d9d7d1',out:'#c2c4ce',speed:1.13,power:1.01,tough:.96},
 {id:'The Greek',style:'Wrestling + Streetfighting',col:'#d8d2c6',out:'#beb8ae',speed:.86,power:1.22,tough:1.24}
];
const $=s=>document.querySelector(s), roster=$('#roster'), fightBtn=$('#fightBtn');let selected=0;
fighters.forEach((f,i)=>{const b=document.createElement('button');b.className='fighter'+(!i?' selected':'');b.innerHTML=`<span class="dot" style="filter:hue-rotate(${i*18}deg)"></span><b>${f.id}</b><small>${f.style}</small>`;b.addEventListener('click',()=>select(i));b.addEventListener('touchend',e=>{e.preventDefault();select(i)},{passive:false});roster.appendChild(b)});
function select(i){selected=i;[...roster.children].forEach((x,j)=>x.classList.toggle('selected',j===i));fightBtn.textContent='FIGHT AS '+fighters[i].id.toUpperCase();navigator.vibrate?.(12)}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active')}
const canvas=$('#gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,dpr=1,raf=0,last=0,acc=0,paused=false,ended=false,timeLeft=60;const STEP=1/60;
const input={x:0,y:0,block:false,run:false};let player,enemy;
function makeActor(f,x,dir){return{f,x,y:0,vx:0,dir,phys:100,con:100,meter:0,stun:0,attack:0,attackType:'',block:false,hitFlash:0,ko:false,combo:0}}
function startFight(){let ei=Math.floor(Math.random()*fighters.length);if(ei===selected)ei=(ei+1)%fighters.length;player=makeActor(fighters[selected],.28,1);enemy=makeActor(fighters[ei],.72,-1);timeLeft=60;paused=false;ended=false;input.x=input.y=0;$('#endOverlay').classList.remove('show');showScreen('game');resize();toast(fighters[selected].id+' VS '+fighters[ei].id,900);cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}
fightBtn.addEventListener('click',startFight);$('#randomBtn').addEventListener('click',()=>{selected=Math.floor(Math.random()*fighters.length);select(selected);startFight()});
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height}
addEventListener('resize',resize,{passive:true});addEventListener('orientationchange',()=>setTimeout(resize,250),{passive:true});
function attack(a,b,type){if(a.ko||a.stun>0||a.attack>0)return;let dur=.28,range=.12,dmg=8,kb=.018,meter=8;if(type==='heavy'){dur=.48;range=.14;dmg=14;kb=.035;meter=13}else if(type==='grab'){dur=.55;range=.105;dmg=18;kb=.05;meter=18}else if(type==='special'){if(a.meter<100){toast('METER NOT FULL',450);return}a.meter=0;dur=.8;range=.17;dmg=28;kb=.075;meter=0;toast(a.f.id.toUpperCase()+' SPECIAL',700)}a.attack=dur;a.attackType=type;setTimeout(()=>{if(!a||!b||a.ko||ended)return;const dist=Math.abs(a.x-b.x);if(dist<=range){const blocked=b.block&&type!=='grab';const dealt=dmg*(blocked?.25:1)*a.f.power;if(!blocked){b.con=Math.max(0,b.con-dealt);b.phys=Math.max(0,b.phys-dealt*.45);b.stun=type==='special'?.6:type==='heavy'?.32:.18;b.x=Math.max(.08,Math.min(.92,b.x+a.dir*kb));b.hitFlash=.12}else{b.con=Math.max(0,b.con-dealt);b.hitFlash=.05}a.meter=Math.min(100,a.meter+meter);if(b.con<=0||b.phys<=0){b.ko=true;finish(a,b)}}},Math.max(80,dur*410))}
function finish(w,l){if(ended)return;ended=true;setTimeout(()=>{cancelAnimationFrame(raf);$('#endTitle').textContent=w===player?'YOU WIN':'YOU LOSE';$('#endCopy').textContent=w.f.id+' knocks out '+l.f.id+'.';$('#endOverlay').classList.add('show');navigator.vibrate?.([50,40,80])},650)}
function toast(t,ms=600){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),ms)}
function ai(dt){if(enemy.ko)return;const d=player.x-enemy.x;enemy.dir=Math.sign(d)||enemy.dir;if(enemy.stun>0||enemy.attack>0)return;enemy.block=false;const ad=Math.abs(d);if(ad>.115){enemy.x+=Math.sign(d)*dt*.085*enemy.f.speed}else{const r=Math.random();if(player.attack>0&&r<.20){enemy.block=true;return}if(enemy.meter>=100&&r<.10)attack(enemy,player,'special');else if(r<.035)attack(enemy,player,'heavy');else if(r<.07)attack(enemy,player,'light');else if(r<.082)attack(enemy,player,'grab')}}
function update(dt){if(paused||ended)return;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;finish(player.con+player.phys>=enemy.con+enemy.phys?player:enemy,player.con+player.phys>=enemy.con+enemy.phys?enemy:player)}[player,enemy].forEach(a=>{a.stun=Math.max(0,a.stun-dt);a.attack=Math.max(0,a.attack-dt);a.hitFlash=Math.max(0,a.hitFlash-dt);if(a.con<a.phys&&a.stun<=0)a.con=Math.min(a.phys,a.con+dt*2.4)});if(!player.ko&&player.stun<=0&&player.attack<=0){const sp=.11*player.f.speed*(input.run?1.65:1);player.x=Math.max(.08,Math.min(.92,player.x+input.x*dt*sp));player.block=input.block;player.dir=Math.sign(enemy.x-player.x)||player.dir}else player.block=false;ai(dt);if(Math.abs(player.x-enemy.x)<.075){const mid=(player.x+enemy.x)/2;player.x=mid-.038;enemy.x=mid+.038}}
function drawActor(a){const ground=H*.73;const x=a.x*W;const s=Math.min(W,H)*.17;ctx.save();ctx.translate(x,ground);ctx.scale(a.dir,1);if(a.ko){ctx.rotate(a.dir*.95);ctx.translate(0,s*.2)}else if(a.hitFlash){ctx.translate((Math.random()-.5)*5,0)}const skin=a.hitFlash?'#fff':a.f.col;ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,s*.68,s*.38,s*.09,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=a.f.out;ctx.fillRect(-s*.22,-s*.57,s*.44,s*.55);ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-s*.72,s*.17,s*.21,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#151112';ctx.fillRect(s*.055,-s*.76,s*.027,s*.018);ctx.fillRect(-s*.08,-s*.76,s*.027,s*.018);ctx.strokeStyle=skin;ctx.lineWidth=s*.13;ctx.lineCap='round';let punch=a.attack>0?(a.attackType==='heavy'?s*.58:s*.45):s*.30;ctx.beginPath();ctx.moveTo(s*.16,-s*.45);ctx.lineTo(punch,-s*.35);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*.16,-s*.45);ctx.lineTo(-s*.30,-s*.28);ctx.stroke();ctx.strokeStyle=a.f.out;ctx.lineWidth=s*.15;ctx.beginPath();ctx.moveTo(s*.12,-s*.05);ctx.lineTo(s*.17,s*.50);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*.12,-s*.05);ctx.lineTo(-s*.17,s*.50);ctx.stroke();if(a.block){ctx.strokeStyle='#f0d9a2';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s*.18,-s*.43,s*.22,-1.4,1.2);ctx.stroke()}if(a.meter>=100){ctx.strokeStyle='#ffcf59';ctx.lineWidth=3;ctx.shadowColor='#ffbd3d';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(0,-s*.42,s*.38,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1115');g.addColorStop(.55,'#2a171b');g.addColorStop(1,'#090607');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#5b1016';ctx.globalAlpha=.35;for(let i=0;i<9;i++){ctx.fillRect((i/8)*W-18,H*.16,36,H*.46)}ctx.globalAlpha=1;ctx.fillStyle='#111';ctx.fillRect(0,H*.73,W,H*.27);ctx.strokeStyle='#4b3338';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H*.73);ctx.lineTo(W,H*.73);ctx.stroke();for(let i=0;i<18;i++){const x=(i/17)*W;ctx.fillStyle=i%3?'#1e1618':'#3b2429';ctx.beginPath();ctx.arc(x,H*.59,14+(i%4)*3,0,Math.PI*2);ctx.fill()}drawActor(player);drawActor(enemy);$('#pName').textContent=player.f.id;$('#eName').textContent=enemy.f.id;$('#pCon').style.width=player.con+'%';$('#pPhys').style.width=player.phys+'%';$('#pMeter').style.width=player.meter+'%';$('#eCon').style.width=enemy.con+'%';$('#ePhys').style.width=enemy.phys+'%';$('#eMeter').style.width=enemy.meter+'%';$('#timer').textContent=Math.ceil(timeLeft)}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP}draw();raf=requestAnimationFrame(loop)}
const stick=$('#stick'),nub=$('#nub');let stickId=null;function stickMove(cx,cy){const r=stick.getBoundingClientRect(),x=cx-(r.left+r.width/2),y=cy-(r.top+r.height/2),max=r.width*.31,len=Math.hypot(x,y)||1,k=Math.min(1,max/len),nx=x*k,ny=y*k;nub.style.transform=`translate(${nx}px,${ny}px)`;input.x=Math.max(-1,Math.min(1,x/max));input.y=Math.max(-1,Math.min(1,y/max))}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture?.(e.pointerId);stickMove(e.clientX,e.clientY);e.preventDefault()});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId){stickMove(e.clientX,e.clientY);e.preventDefault()}});function stickUp(){if(stickId===null)return;stickId=null;input.x=input.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stickUp);stick.addEventListener('pointercancel',stickUp);
document.querySelectorAll('.act').forEach(b=>{const a=b.dataset.act;const down=e=>{e.preventDefault();b.classList.add('down');if(a==='block')input.block=true;else if(a==='run')input.run=true;else attack(player,enemy,a);navigator.vibrate?.(8)};const up=e=>{e.preventDefault();b.classList.remove('down');if(a==='block')input.block=false;if(a==='run')input.run=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)});
$('#pauseBtn').addEventListener('click',()=>{paused=!paused;toast(paused?'PAUSED':'FIGHT',500)});$('#rematchBtn').addEventListener('click',startFight);$('#menuBtn').addEventListener('click',()=>{cancelAnimationFrame(raf);$('#endOverlay').classList.remove('show');showScreen('menu')});
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='a'||e.key==='ArrowLeft')input.x=-1;if(e.key==='d'||e.key==='ArrowRight')input.x=1;if(e.key==='j')attack(player,enemy,'light');if(e.key==='k')attack(player,enemy,'heavy');if(e.key==='l')attack(player,enemy,'grab');if(e.key===' ')attack(player,enemy,'special')});addEventListener('keyup',e=>{if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))input.x=0});
})();
</script>
</body></html>
