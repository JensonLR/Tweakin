name: Likeness QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  likeness:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/tweakin-likeness-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4174/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/tweakin-likeness-http.log; exit 1
      - name: Capture all procedural fighters
        run: |
          mkdir -p likeness-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const ids=['trump','netanyahu','kirk','floyd','wojak','gigachad','agarthan','greek'];
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const ctx=await browser.newContext({viewport:{width:900,height:900},deviceScaleFactor:1});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4174/',{waitUntil:'networkidle',timeout:45000});
            await page.waitForFunction(()=>window.__TWEAKIN_GAME__,null,{timeout:30000});
            await page.evaluate(()=>{const g=window.__TWEAKIN_GAME__;g.stop();g.running=false;cancelAnimationFrame(g.raf);document.getElementById('ui-root').style.display='none';});
            for(const id of ids){
              await page.evaluate(async fighterId=>{
                const [{THREE},{SignatureFighter},{getFighterDef}]=await Promise.all([import('/vendor/three.js'),import('/game/SignatureFighter.js'),import('/data/roster.js')]);
                const g=window.__TWEAKIN_GAME__;
                if(window.__LIK_SCENE__){window.__LIK_SCENE__.traverse(o=>{o.geometry?.dispose?.();const ms=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];ms.forEach(m=>m?.dispose?.())});}
                const scene=new THREE.Scene();scene.background=new THREE.Color(0x07080a);
                const fighter=new SignatureFighter(getFighterDef(fighterId),0);fighter.group.position.set(0,0,0);fighter.group.rotation.y=0;fighter.yaw=0;scene.add(fighter.group);
                const floor=new THREE.Mesh(new THREE.CircleGeometry(3.2,48),new THREE.MeshStandardMaterial({color:0x101216,roughness:.72,metalness:.04}));floor.rotation.x=-Math.PI/2;floor.position.y=.002;floor.receiveShadow=true;scene.add(floor);
                scene.add(new THREE.HemisphereLight(0xe7efff,0x201419,2.1));
                const key=new THREE.DirectionalLight(0xffe3d0,4.7);key.position.set(-2.6,5.4,3.4);key.castShadow=true;scene.add(key);
                const fill=new THREE.DirectionalLight(0xb8d1ff,2.2);fill.position.set(3,2.8,3.8);scene.add(fill);
                const rim=new THREE.PointLight(0xff3044,9,9,1.6);rim.position.set(2.4,2.5,-2.0);scene.add(rim);
                g.renderer.setPixelRatio(1);g.renderer.setSize(900,900,false);g.renderer.toneMapping=THREE.ACESFilmicToneMapping;g.renderer.toneMappingExposure=1.08;
                window.__LIK_SCENE__=scene;window.__LIK_FIGHTER__=fighter;
              },id);
              const render=async(pos,look,fov,path)=>{await page.evaluate(({pos,look,fov})=>{const g=window.__TWEAKIN_GAME__,s=window.__LIK_SCENE__;g.camera.position.set(...pos);g.camera.fov=fov;g.camera.aspect=1;g.camera.updateProjectionMatrix();g.camera.lookAt(...look);g.renderer.render(s,g.camera);},{pos,look,fov});await page.locator('#render-host canvas').screenshot({path});};
              await render([0,1.55,5.5],[0,1.38,0],28,`likeness-artifacts/${id}-full.png`);
              await render([0,2.50,1.32],[0,2.48,0],18,`likeness-artifacts/${id}-face.png`);
              await render([1.02,2.52,1.32],[0,2.47,0],20,`likeness-artifacts/${id}-three-quarter.png`);
            }
            await ctx.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload likeness QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweakin-likeness-qa
          path: likeness-artifacts/
          if-no-files-found: error
          retention-days: 7
