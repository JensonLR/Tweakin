<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#090909" />
  <meta name="description" content="TWEAKIN — browser-native 3D underground fighting game." />
  <title>TWEAKIN</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="preload" href="./assets/tweakin-logo.webp" as="image" type="image/webp" />
  <link rel="preload" href="./assets/tweakin-hero.webp" as="image" type="image/webp" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./style-premium.css" />
  <link rel="stylesheet" href="./style-cinematic.css" />
  <link rel="stylesheet" href="./style-enhancements.css" />
  <link rel="stylesheet" href="./style-extra.css" />
  <link rel="stylesheet" href="./style-brand.css" />
  <link rel="stylesheet" href="./style-polish.css" />
  <link rel="stylesheet" href="./style-final.css" />
  <link rel="stylesheet" href="./style-ux.css" />
  <link rel="stylesheet" href="./style-beauty.css" />
  <link rel="stylesheet" href="./style-portraits.css" />
</head>
<body>
  <div id="app">
    <div id="render-host"></div>
    <div id="fx-overlay"></div>
    <div id="ui-root">
      <div class="boot-shell">
        <img class="boot-logo-image" src="./assets/tweakin-logo.webp" alt="TWEAKIN" />
        <div class="boot-wordmark boot-wordmark-fallback"><span>TWEA</span><b>KIN</b></div>
        <div class="boot-rule"></div>
        <div class="boot-copy">ENTER THE FIGHT WORLD</div>
      </div>
    </div>
  </div>
  <noscript>TWEAKIN requires JavaScript.</noscript>
  <script>if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
  <script type="module" src="./main.js"></script>
</body>
</html>
